<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户列表数据</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
<h2>用户列表数据</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>密码</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>更新时间</th>
    </tr>
    </thead>
    <tbody id="userTableBody">
    </tbody>
</table>

<script>
    fetch('/list')
        .then(response => response.json())
        .then(data => {
            let html = '';
            data.forEach(user => {
                html += '<tr>' +
                    '<td>' + user.id + '</td>' +
                    '<td>' + user.username + '</td>' +
                    '<td>' + user.password + '</td>' +
                    '<td>' + user.name + '</td>' +
                    '<td>' + user.age + '</td>' +
                    '<td>' + user.updateTime + '</td>' +
                    '</tr>';
            });
            document.getElementById('userTableBody').innerHTML = html;
        })
        .catch(err => {
            document.getElementById('userTableBody').innerHTML =
                '<tr><td colspan="6" style="color:red;">加载失败: ' + err + '</td></tr>';
        });
</script>
</body>
</html>
